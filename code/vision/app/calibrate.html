<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Slot calibration</title>
<style>
  :root { --bg: #f4f5f7; --card: #fff; --text: #1d2125; --muted: #5e6670; --accent: #1f6feb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #111418; --card: #1b2026; --text: #e6e9ed; --muted: #9aa4af; --accent: #4c8dff; }
  }
  body { margin: 0; padding: 16px; font: 14px/1.4 system-ui, sans-serif; background: var(--bg); color: var(--text); }
  h1 { font-size: 1.1rem; margin: 0 0 12px; }
  .bar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 12px; }
  select, button { font: inherit; padding: 6px 10px; border-radius: 6px; border: 1px solid #8884; background: var(--card); color: var(--text); }
  button.primary { background: var(--accent); color: #fff; border-color: transparent; }
  .card { background: var(--card); border-radius: 10px; padding: 12px; max-width: 680px; }
  canvas { width: 100%; height: auto; display: block; border-radius: 6px; cursor: crosshair; background: #000; }
  .meta { color: var(--muted); margin-top: 8px; }
</style>
</head>
<body>
<h1>Slot calibration</h1>
<div class="bar">
  <select id="device"></select>
  <button id="close">Finish slot</button>
  <button id="undo">Undo</button>
  <button id="clear">Clear all</button>
  <button id="save" class="primary">Save</button>
</div>
<div class="card">
  <canvas id="canvas" width="640" height="480"></canvas>
  <div class="meta" id="meta">Waiting for frames ...</div>
</div>
<p class="meta">Click the corners of a slot on the ground, then "Finish slot". Green = free, red = occupied,
grey = unknown, yellow boxes = detected bikes.</p>
<script>
const $ = (id) => document.getElementById(id);
const ctx = $("canvas").getContext("2d");
const img = new Image();
let device = null, slots = [], draft = [], detections = { boxes: [], slots: [] }, dirty = false;

const colors = { free: "#2ea043", occupied: "#da3633", unknown: "#8b949e" };

function draw() {
  const c = $("canvas");
  if (img.naturalWidth) { c.width = img.naturalWidth; c.height = img.naturalHeight; ctx.drawImage(img, 0, 0); }
  const state = Object.fromEntries(detections.slots.map((s) => [s.slot_id, s.state]));
  for (const s of slots) poly(s.polygon, colors[state[s.slot_id]] || "#1f6feb", s.slot_id);
  if (draft.length) poly(draft, "#1f6feb", null, false);
  ctx.strokeStyle = "#e3b341"; ctx.lineWidth = 2;
  for (const b of detections.boxes) {
    ctx.strokeRect(b.x1, b.y1, b.x2 - b.x1, b.y2 - b.y1);
    ctx.fillStyle = "#e3b341"; ctx.fillText(`${b.label} ${b.conf.toFixed(2)}`, b.x1 + 3, b.y1 + 12);
  }
}

function poly(points, color, label, closed = true) {
  ctx.beginPath();
  points.forEach(([x, y], i) => (i ? ctx.lineTo(x, y) : ctx.moveTo(x, y)));
  if (closed) ctx.closePath();
  ctx.strokeStyle = color; ctx.lineWidth = 2; ctx.stroke();
  if (closed) { ctx.fillStyle = color + "44"; ctx.fill(); }
  for (const [x, y] of points) { ctx.fillStyle = color; ctx.fillRect(x - 3, y - 3, 6, 6); }
  if (label) {
    const cx = points.reduce((a, p) => a + p[0], 0) / points.length;
    const cy = points.reduce((a, p) => a + p[1], 0) / points.length;
    ctx.fillStyle = "#fff"; ctx.font = "bold 14px system-ui"; ctx.fillText(label, cx - 8, cy + 5);
  }
}

$("canvas").addEventListener("click", (e) => {
  const r = e.target.getBoundingClientRect();
  const sx = e.target.width / r.width, sy = e.target.height / r.height;
  draft.push([Math.round((e.clientX - r.left) * sx), Math.round((e.clientY - r.top) * sy)]);
  draw();
});
$("close").onclick = () => {
  if (draft.length < 3) return;
  let n = slots.length + 1;
  while (slots.some((s) => s.slot_id === "s" + n)) n++;
  slots.push({ slot_id: "s" + n, polygon: draft }); draft = []; dirty = true; draw();
};
$("undo").onclick = () => { draft.length ? draft.pop() : slots.pop(); dirty = true; draw(); };
$("clear").onclick = () => { slots = []; draft = []; dirty = true; draw(); };
$("save").onclick = async () => {
  const body = { device_id: device, image_width: $("canvas").width, image_height: $("canvas").height, slots };
  const r = await fetch(`/api/v1/devices/${device}/slots`, {
    method: "PUT", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body),
  });
  $("meta").textContent = r.ok ? `Saved ${slots.length} slots for ${device}` : `Save failed: ${await r.text()}`;
  if (r.ok) dirty = false;
};
$("device").onchange = () => selectDevice($("device").value);

async function selectDevice(id) {
  device = id; draft = []; dirty = false;
  slots = (await (await fetch(`/api/v1/devices/${id}/slots`)).json()).slots;
  refresh();
}

async function refresh() {
  try {
    const list = await (await fetch("/api/v1/devices")).json();
    const sel = $("device");
    const ids = list.map((d) => d.device_id);
    if (sel.options.length !== ids.length) sel.innerHTML = ids.map((d) => `<option>${d}</option>`).join("");
    if (!device && ids.length) { sel.value = ids[0]; return selectDevice(ids[0]); }
    const info = list.find((d) => d.device_id === device);
    if (!info) return;
    detections = await (await fetch(`/api/v1/devices/${device}/detections`)).json();
    img.src = `/api/v1/devices/${device}/frame.jpg?t=${Date.now()}`;
    $("meta").textContent = `${info.bikes} bikes · RSSI ${info.rssi} dBm · ${info.age_s} s ago` +
      (dirty ? " · unsaved changes" : "");
  } catch { /* service restarting */ }
}
img.onload = draw;
setInterval(refresh, 2000);
refresh();
</script>
</body>
</html>
