; Default: upload over USB. OTA upload: pio run -e xiao_s3_ota -t upload
[platformio]
default_envs = xiao_s3

[env:xiao_s3]
platform = espressif32@6.9.0
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
build_flags = -DARDUINO_USB_CDC_ON_BOOT=1

; Over-the-air update instead of USB.
; upload_port = camera IP (printed in the serial log after "WiFi connected")
[env:xiao_s3_ota]
extends = env:xiao_s3
upload_protocol = espota
upload_port = 192.168.21.63
extra_scripts = pre:scripts/ota_auth.py
